name: Android checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease
      - name: Keyboard layout regression
        shell: bash
        run: |
          jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.0.21" -name 'kotlin-stdlib-2.0.21.jar' -type f -print -quit)
          test -n "$jar"
          java -cp "app/build/tmp/kotlin-classes/debug:$jar" checks/KeyboardLayoutCheck.java
          java -cp "app/build/tmp/kotlin-classes/debug:$jar" checks/CursorMovementCheck.java
      - name: Build disposable partial-extraction probe (test branch only)
        run: ./gradlew -p checks/offset-probe --no-daemon assembleDebug
